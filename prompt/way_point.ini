✅ Claude Prompt（直接复制给Claude）
你是一个专业的ROS开发者，我需要你为我生成一个完整的ROS Noetic包，完成如下功能：

🛰️ 背景任务：
我在做一个野生动物巡查系统，使用无人机飞行。在仿真中，我要设置起点，禁飞区，计算可行航线（避开禁飞区）并回到起点。具体如下：

📥 输入：
起飞点：输入格式为 "A9B1"，即网格坐标（可以类比棋盘坐标系）。

禁飞区坐标：三块区域，格式为："A3B3 A4B3 A5B3"，表示这些坐标不可通行。

地图大小：10 × 10 网格（A1B1 到 A10B10）。

🎯 输出要求：
你需要生成一个 ROS Noetic 包，满足以下要求：

节点启动后，读取起飞点和禁飞区坐标。

在不经过禁飞区的前提下遍历地图上所有可通行点，并最终返回起点，形成闭环航线。

使用 A* 算法或其他高效路径搜索算法（例如回溯 + 剪枝、BFS + 状态记录），确保路径最短或合理。

输出最终航点路径的坐标数组（二维数组或 Point 数组都可以）。

最好将航点发布为 /waypoints 主题（自定义 geometry_msgs/Point[] 类型），供其他节点使用。

可视化显示推荐使用 RViz，或者给出如何在 RViz 中显示路径。

📁 包结构要求：
bash
复制
编辑
waypoint_planner/
├── CMakeLists.txt
├── package.xml
├── launch/
│   └── plan.launch
├── src/
