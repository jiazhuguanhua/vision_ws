└── config/
    └── map.yaml          # 可选，表示网格地图
🧠 编程要求：
使用 Python 实现（ROS Python 节点）。

给出详细注释，尤其是坐标转换、算法实现部分。

起点与禁飞区坐标作为参数传入（可使用 ROS 参数服务器或读取 rosparam）。

保证禁飞区不会被飞过。

遍历顺序尽可能高效，保证计算速度在仿真内能实时运行。

