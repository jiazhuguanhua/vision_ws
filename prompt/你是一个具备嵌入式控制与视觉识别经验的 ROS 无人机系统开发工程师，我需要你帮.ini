你是一个具备嵌入式控制与视觉识别经验的 ROS 无人机系统开发工程师，我需要你帮我实现一个完整的无人机自主任务系统，基于以下背景和要求：

---

🧠【项目背景】

1. 无人机系统基于 ROS1 Noetic，控制飞控为 PX4（通过 MAVROS 与 MAVLINK 连接）。
2. 定位由 Realsense T265 相机完成，通过 `/camera/odom/sample` 发布 `nav_msgs/Odometry`。
3. 我们使用 AprilTag（用 `apriltag_ros` 我已经下载在workspace里面了）识别二维码进行中途目标检测和精准降落。
4. 使用 Python 开发 ROS 节点，每个功能模块单独成包，具备良好拓展性。

---

🚀【系统功能任务流程】

1. **自主起飞**：无人机从固定位置起飞。
2. **导航飞行**：飞往第一个航点（任务区），航点可通过参数配置或 yaml 文件设定。
3. **二维码识别（AprilTag）**：在任务区识别二维码，确定二维码相对于无人机的位置。
4. **激光控制**：对准二维码中心后，打开激光（树莓派 GPIO 控制）持续一段时间，然后关闭。
5. **飞往降落区**：无人机前往另一个航点，并开始精确降落。
6. **精确降落**：通过下视相机识别地面 AprilTag，进行位置偏差计算，并用 PID 控制无人机缓慢降落。
7. **任务完成后自动落地并上锁。**

---

🧱【项目结构与包划分】

请为以下 ROS 包分别生成节点代码（Python），每个节点应结构清晰、使用 rospy 编写、包含注释与参数读取。

### 1. `flight_control`
- 负责：起飞、飞行控制、前往航点、任务状态机调度。
- 输入：
  - `/mavros/state`（飞控连接状态）
  - `/mavros/local_position/pose`
  - 参数读取航点坐标（从 yaml 或 launch 读取）
- 输出：
  - `/mavros/setpoint_position/local`（控制飞行）
- 要求：
  - 起飞高度、任务区航点、降落区航点都支持参数修改
  - 提供任务状态调度机制，如：`TAKEOFF → GOTO → SCAN → LASER → GOTO_LAND → LAND`

---

### 2. `apriltag_detector`
- 负责：识别 AprilTag 并估计其在相机坐标系下的位置（可转换为无人机坐标系）
- 输入：
  - `/camera/image_raw`（图像）
  - 相机内参（使用 `camera_info` topic 或 yaml）
- 输出：
  - `/apriltag/pose`：二维码位姿（`geometry_msgs/PoseStamped`）
  - 可选 `/apriltag/debug_image`
- 要求：
  - 使用 OpenCV + apriltag Python 包（如 `apriltag` 或 `apriltag_ros`）
  - 支持多个 ID 区分不同二维码（如：导航 vs 降落）

---

### 3. `laser_control`
- 负责：控制激光发射器（如树莓派 GPIO 或串口控制）
- 输入：
  - `/laser_fire`（std_msgs/Bool）是否开启
- 要求：
  - 持续发射时间设为参数（如2秒自动关闭）
  - 使用 `RPi.GPIO` 或 `pyserial` 实现硬件控制

---

### 4. `precision_landing`
- 负责：基于 AprilTag 实现精准降落
- 输入：
  - `/apriltag/pose`：二维码位置
  - 当前无人机位置 `/mavros/local_position/pose`
- 输出：
  - `/mavros/setpoint_position/local`（控制无人机对准）
- 要求：
  - 自实现 PID 控制器纠偏降落
  - 降落成功条件：高度低于阈值，偏差在限内
  - 降落后切换模式为 `AUTO.LAND` 并 disarm

---

### 5. `common_msgs`
- 包含自定义消息，如任务状态、航点列表、识别状态等

---

📂【配置与调试】

- 所有参数（如航点坐标、相机参数、降落阈值等）支持通过 YAML 配置文件加载
- 启动文件统一管理，例如 `full_mission.launch` 包含所有节点加载与参数导入

