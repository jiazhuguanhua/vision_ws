你是一个熟练使用 ROS1 Noetic 的无人机软件工程师，帮我生成一个 ROS 包，包含以下节点。使用 Python 编写，要求模块清晰、代码规范，并使用 rospy 编写。

我已经使用了 PX4 + MAVROS + T265 架构，飞行控制用 `/mavros/setpoint_position/local` 发布目标位置，坐标系使用 NED（以起飞点为原点）。

请根据以下系统架构，帮我生成每个节点的独立代码,代码尽量简洁易懂，多部分配合运作。

---

系统节点与功能说明如下：

1. **/link_comm**
设计一个适合的串口协议
   - 通过串口与地面站通信（BLE 透传模块）
   - 接收禁飞区方格代码（例如：["A3B3", "A4B3", "A5B3"]）
   - 接收起飞点方格（例如："A9B1"）
   - 接收到后，发布一个 ROS topic：`/planning_input`，消息包含禁飞区和起飞点
   - 当识别到动物时，发布：`(动物种类、数量、方格编号)` 到地面站

2. **/waypoint_planner**（已经有了，不用生成）
   - 订阅 `/planning_input`，收到禁飞区和起飞点
   - 使用 A* 或其他算法生成避开禁飞区的最短航线（覆盖所有非禁飞格）
   - 输出：NED 坐标航点数组（发布到 `/waypoints` topic，类型为 `geometry_msgs/PoseArray`）

3. **/flight_control**
   - 订阅 `/waypoints`，逐点发布 `/mavros/setpoint_position/local`
   - 到达每个航点后，发布 `/detect_trigger` topic（触发图像识别）
   - 接收 `/animal_detect` 识别结果，如果有动物：
     - 调用 laser_controller的接口（自己去找）
     - 发送识别信息（种类、数量、坐标）到 `/link_comm`
   - 最后一个航点时，触发 `/landing_mode` 节点执行降落

4. **/animal_detect**
   - 订阅 `/detect_trigger`，从向下单目摄像头读取图像，调用我训练好的yolo模型识别动物
   - 输出：动物种类 + 数量（发布到 `/animal_result`）

5. **/laser_controller**（已经有了，不用生成）
   - 订阅 `/animal_result` 和无人机当前位置
   - 控制激光舵机，使光斑打在图像中识别到的动物中心

6. **/landing_mode**
   - 被 `/flight_control` 触发后，开始以 45°角降落（设置轨迹 setpoint）
   - 降落时闪烁LED，通过连续发布 `/mavros/setpoint_position/local`

---

要求：
- 每个节点独立成文件
- 使用 `rospy`, 并给出 package 结构
- 若涉及坐标转换，请注明是否用的是 NED，本地坐标还是其他
- 所有 topic 和服务名与上方保持一致
- 使用简单清晰的数据结构，如 `PoseStamped`, `PoseArray` 等

请从 `/link_comm` 节点开始生成代码，逐步给出完整包。
