# 无人机巡逻系统参数配置

# 通信参数
communication:
  uart_port: "/dev/ttyUSB0"
  uart_baudrate: 115200
  ble_enabled: true
  status_rate: 1.0
  
# 飞行控制参数
flight_control:
  takeoff_altitude: 1.2  # 起飞高度 (米)
  cruise_speed: 1.0      # 巡航速度 (m/s)
  position_tolerance: 0.3 # 位置容差 (米)
  status_rate: 10.0      # 状态发布频率 (Hz)
  max_altitude: 10.0     # 最大飞行高度 (米)
  min_altitude: 0.5      # 最小飞行高度 (米)
  
# 动物检测参数
animal_detection:
  camera_index: 0
  image_width: 640
  image_height: 480
  detection_rate: 5.0    # 检测频率 (Hz)
  confidence_threshold: 0.5
  nms_threshold: 0.4
  
  # YOLO模型路径
  yolo_weights: "/home/micoair/yolo/yolov4.weights"
  yolo_config: "/home/micoair/yolo/yolov4.cfg"
  yolo_classes: "/home/micoair/yolo/coco.names"
  
  # AprilTag检测
  apriltag_enabled: true
  
  # 激光控制
  laser_enabled: true
  auto_track: true
  
# 降落模式参数
landing:
  landing_speed: 0.5     # 降落速度 (m/s)
  descent_angle: 45.0    # 下降角度 (度)
  minimum_altitude: 0.2  # 最低安全高度 (米)
  safety_radius: 2.0     # 安全半径 (米)
  led_enabled: true
  led_pin: 18           # LED控制GPIO引脚
  
# 航点规划参数
waypoint_planning:
  grid_size: 9          # 网格大小 (9x9)
  cell_size: 5.0        # 单元格大小 (米)
  default_height: 1.2   # 默认飞行高度 (米)
  
  # 禁飞区 (网格坐标)
  no_fly_zones:
    - [2, 2]  # A3
    - [2, 3]  # A4
    - [3, 2]  # B3
    - [3, 3]  # B4
    - [6, 6]  # G7
    - [7, 6]  # H7
    - [6, 7]  # G8
    - [7, 7]  # H8
    
# 激光控制参数
laser_control:
  laser_pin: 12         # 激光GPIO引脚
  servo_x_pin: 13       # X轴舵机GPIO引脚
  servo_y_pin: 15       # Y轴舵机GPIO引脚
  
  # 舵机范围 (度)
  servo_x_min: -90
  servo_x_max: 90
  servo_y_min: -45
  servo_y_max: 45
  
  # 舵机速度 (度/秒)
  servo_speed: 60
  
# 安全参数
safety:
  battery_warning_voltage: 11.5  # 电池警告电压
  battery_critical_voltage: 11.0 # 电池危险电压
  max_wind_speed: 5.0           # 最大风速 (m/s)
  gps_min_satellites: 6         # GPS最少卫星数
  
# 调试参数
debug:
  enable_image_output: true
  save_detection_images: false
  log_level: "INFO"  # DEBUG, INFO, WARN, ERROR
